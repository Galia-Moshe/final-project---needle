<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYC Safe Walking Route Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<header>
  <h1>NYC Safe Walking Route Finder</h1>
  <span class="subtitle">New York City &mdash; Walking Directions</span>
</header>

<div class="layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">

    <section class="panel">
      <h2>Data View</h2>
      <div class="case-toggle" id="case-toggle">
        <button type="button" class="case-btn active" data-case="nypd">NYPD Crime Data</button>
        <button type="button" class="case-btn" data-case="reviews">Tourist Review Data</button>
      </div>
    </section>

    <section class="panel">
      <h2>Find Walking Route</h2>
      <form id="route-form">
        <label for="source-input">From</label>
        <input id="source-input" type="text"
               placeholder="e.g. Central Park, 350 5th Ave…"
               required autocomplete="off">

        <label for="dest-input">To</label>
        <input id="dest-input" type="text"
               placeholder="e.g. Brooklyn Bridge, 200 Water St…"
               required autocomplete="off">

        <button type="submit" id="search-btn">Find Safe Walking Route</button>
      </form>
      <div id="form-error" class="error-msg" style="display:none"></div>
    </section>

    <section class="panel" id="results-panel" style="display:none">
      <h2>Route</h2>
      <div id="route-cards"></div>
    </section>

    <section class="panel">
      <h2>Quick Pick</h2>
      <p class="hint">Click the map to drop a start pin, then click again to drop a destination pin — a walking route searches automatically.</p>
    </section>

  </aside>

  <!-- ── Map ── -->
  <div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/js/map.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
